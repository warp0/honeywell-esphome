esphome:
  name: honeywell_htram
  platform: ESP32
  board: esp32dev

wifi:
  ssid: "YOUR_WIFI"
  password: "YOUR_PASS"

logger:

api:

ota:

uart:
  id: uart_bus
  rx_pin: GPIO16
  baud_rate: 9600

globals:
  - id: co2_value
    type: int
    restore_value: no
    initial_value: "0"

sensor:
  - platform: template
    id: co2_sensor
    name: "CO2 Level"
    unit_of_measurement: "ppm"
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      return id(co2_value);

interval:
  - interval: 1s
    then:
      - lambda: |-
          static const uint8_t FRAME_HEADER_0 = 0xFE;
          static const uint8_t FRAME_HEADER_1 = 0x04;
          static const uint8_t FRAME_HEADER_2 = 0x02;
          static const size_t FRAME_SIZE = 7;
          static const size_t CRC_INPUT_SIZE = 5;
          static const size_t VALUE_MSB_INDEX = 3;
          static const size_t VALUE_LSB_INDEX = 4;
          static const size_t CRC_LOW_INDEX = 5;
          static const size_t CRC_HIGH_INDEX = 6;

          auto modbus_crc = [](const uint8_t *data, size_t len) {
            uint16_t crc = 0xFFFF;
            for (size_t i = 0; i < len; i++) {
              crc ^= data[i];
              for (size_t bit = 0; bit < 8; bit++) {
                if (crc & 0x0001) {
                  crc = (crc >> 1) ^ 0xA001;
                } else {
                  crc >>= 1;
                }
              }
            }
            return crc;
          };

          static uint8_t frame[FRAME_SIZE];
          static size_t frame_pos = 0;

          int pending_bytes = id(uart_bus).available();
          while (pending_bytes-- > 0) {
            uint8_t byte;
            if (!id(uart_bus).read_byte(&byte)) {
              continue;
            }

            if (frame_pos == 0 && byte != FRAME_HEADER_0) {
              continue;
            }

            if (frame_pos == 1 && byte != FRAME_HEADER_1) {
              frame_pos = 0;
              if (byte == FRAME_HEADER_0) {
                frame[frame_pos++] = byte;
              }
              continue;
            }

            if (frame_pos == 2 && byte != FRAME_HEADER_2) {
              frame_pos = 0;
              if (byte == FRAME_HEADER_0) {
                frame[frame_pos++] = byte;
              }
              continue;
            }

            frame[frame_pos++] = byte;

            if (frame_pos == FRAME_SIZE) {
              frame_pos = 0;

              const uint16_t expected_crc = modbus_crc(frame, CRC_INPUT_SIZE);
              const uint16_t reported_crc =
                  static_cast<uint16_t>(frame[CRC_LOW_INDEX]) |
                  (static_cast<uint16_t>(frame[CRC_HIGH_INDEX]) << 8);

              if (expected_crc == reported_crc) {
                const int value =
                    (frame[VALUE_MSB_INDEX] << 8) | frame[VALUE_LSB_INDEX];
                id(co2_value) = value;
                id(co2_sensor).publish_state(value);
              }
            }
          }
