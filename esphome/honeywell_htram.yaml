esphome:
  name: honeywell_htram
  platform: ESP32
  board: esp32dev

wifi:
  ssid: "YOUR_WIFI"
  password: "YOUR_PASS"

logger:

api:

ota:

uart:
  id: uart_bus
  rx_pin: GPIO16
  baud_rate: 9600

globals:
  - id: co2_value
    type: int
    restore_value: no
    initial_value: "0"

sensor:
  - platform: template
    id: co2_sensor
    name: "CO2 Level"
    unit_of_measurement: "ppm"
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      return id(co2_value);

interval:
  - interval: 1s
    then:
      - lambda: |-
          while (id(uart_bus).available() >= 7) {
            uint8_t buf[7];
            id(uart_bus).read_array(buf, 7);

            if (buf[0] == 0xFE && buf[1] == 0x04 && buf[2] == 0x02) {
              const int value = (buf[3] << 8) | buf[4];
              id(co2_value) = value;
              id(co2_sensor).publish_state(value);
            }
          }
